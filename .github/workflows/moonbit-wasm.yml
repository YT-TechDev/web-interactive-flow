name: moonbit-wasm

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  moonbit-wasm:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install and verify qualified MoonBit toolchain
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s latest
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.moon/bin:$PATH"
          versions="$(moon version --all)"
          printf '%s\n' "$versions"
          grep -F "moon 0.1.20260920 (914d7da" <<< "$versions"
          grep -F "moonc v0.10.14+7d59c7ec9" <<< "$versions"
          grep -F "moonrun 0.1.20260920 (914d7da" <<< "$versions"

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Check formatting
        run: moon fmt --check

      - name: Check Wasm target
        run: moon check --target wasm --deny-warn --frozen

      - name: Test Wasm target
        run: moon test --target wasm --deny-warn --frozen

      - name: Build Wasm target
        run: moon build --target wasm --deny-warn --frozen

      - name: Verify scalar Wasm ABI artifact
        run: |
          test -f _build/wasm/debug/build/core/core.wasm
          node tools/abi/verify.mjs _build/wasm/debug/build/core/core.wasm

      - name: Test JS semantic wrapper
        run: node --test tests/bridge/runtime.test.mjs

      - name: Test browser Wasm module acquisition
        run: node --test tests/bridge/module_compiler.test.mjs

      - name: Test browser clock normalizer
        run: node --test tests/bridge/clock.test.mjs

      - name: Test browser frame scheduler
        run: node --test tests/bridge/frame_scheduler.test.mjs

      - name: Test DOM wheel ownership
        run: node --test tests/bridge/wheel_ownership.test.mjs

      - name: Install isolated R3F qualification fixture
        run: npm --prefix tests/r3f/fixture ci --ignore-scripts --no-audit --no-fund

      - name: Qualify read-only R3F frame consumption
        run: node --test tests/r3f/fixture/qualification.test.mjs

      - name: Qualify production explicit-Runtime R3F hook
        run: node --test tests/r3f/fixture/production_hook.test.mjs

      - name: Qualify local package artifact topology
        run: node --test tests/package/package_artifact.test.mjs

      - name: Qualify production Web composition in real Chrome
        shell: bash
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
          elif command -v chromium >/dev/null 2>&1; then
            chromium --version
          else
            echo "No Chrome/Chromium executable found on runner" >&2
            exit 1
          fi
          chromedriver --version
          node tools/browser/qualify_real_browser.mjs
          node --test tests/browser/qualification_contract.test.mjs

  differential-reference:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Regenerate and verify committed differential tests
        run: |
          node tools/differential/generate.mjs
          git diff --exit-code -- \
            core/differential_generated_wbtest.mbt \
            tests/differential/generated/reference.generated.test.ts

      - name: Check out pinned behavioral reference
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: YT-TechDev/r3f-interactive-flow
          ref: 9c1e1d7b4dee026f4e5724435315f72eb11974ce
          path: reference/r3f-interactive-flow
          persist-credentials: false

      - name: Verify pinned reference provenance
        shell: bash
        run: |
          actual="$(git -C reference/r3f-interactive-flow rev-parse HEAD)"
          test "$actual" = "9c1e1d7b4dee026f4e5724435315f72eb11974ce"

      - name: Install pinned reference dependencies
        working-directory: reference/r3f-interactive-flow
        run: |
          corepack enable
          corepack prepare pnpm@11.5.0 --activate
          pnpm --version | grep -Fx '11.5.0'
          pnpm install --frozen-lockfile

      - name: Copy generated differential test into reference core
        run: |
          cp tests/differential/generated/reference.generated.test.ts \
            reference/r3f-interactive-flow/packages/r3f-interactive-flow/src/core/web-interactive-flow.differential.generated.test.ts

      - name: Run only the generated reference differential test
        working-directory: reference/r3f-interactive-flow
        run: pnpm exec vitest run packages/r3f-interactive-flow/src/core/web-interactive-flow.differential.generated.test.ts
