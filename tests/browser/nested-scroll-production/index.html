<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>WIF explicit nested scroll ownership qualification</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
    }

    #flow-root {
      width: 560px;
      margin: 24px;
      padding: 16px;
      border: 2px solid;
    }

    #native-scroll {
      width: 440px;
      height: 180px;
      overflow-y: auto;
      overscroll-behavior-y: contain;
      border: 1px solid;
    }

    #native-scroll-content {
      height: 720px;
    }

    #flow-owned {
      width: 440px;
      min-height: 120px;
      margin-top: 24px;
      border: 1px dashed;
    }
  </style>
</head>
<body>
  <div id="flow-root">
    <div id="native-scroll" data-wif-native-scroll>
      <div id="native-scroll-content"></div>
    </div>
    <div id="flow-owned" tabindex="0">flow-owned region</div>
  </div>
  <pre id="qualification-output"></pre>
  <script type="module" src="/fixture/main.mjs"></script>
</body>
</html>
