<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>WIF production pointer listener qualification</title>
  <style>
    html, body { margin: 0; min-height: 100%; }
    body { padding: 24px; }
    .region {
      width: 360px;
      height: 180px;
      overflow: hidden;
      border: 2px solid;
      margin-bottom: 28px;
      touch-action: none;
    }
    .content {
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      padding: 12px;
    }
    #ua-auto {
      overflow-y: auto;
      touch-action: auto;
    }
    #ua-auto .content {
      height: 900px;
    }
  </style>
</head>
<body>
  <div id="scope" class="region"><div id="scope-content" class="content">scope</div></div>
  <div id="outside" class="region"><div id="outside-content" class="content">outside</div></div>
  <div id="reject" class="region"><div id="reject-content" class="content">reject</div></div>
  <div id="cleanup" class="region"><div id="cleanup-content" class="content">cleanup</div></div>
  <div id="replacement-a" class="region"><div id="replacement-a-content" class="content">replacement A</div></div>
  <div id="replacement-b" class="region"><div id="replacement-b-content" class="content">replacement B</div></div>
  <div id="ua-auto" class="region"><div id="ua-auto-content" class="content">UA auto</div></div>
  <pre id="qualification-output"></pre>
  <script type="module" src="/fixture/main.mjs"></script>
</body>
</html>
