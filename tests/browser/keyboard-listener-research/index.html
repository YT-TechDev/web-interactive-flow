<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>WIF keyboard listener boundary research</title>
  <style>
    html, body { margin: 0; min-height: 100%; }
    section {
      margin: 18px;
      padding: 14px;
      border: 1px solid;
    }
    .focusable {
      display: block;
      margin: 10px 0;
      padding: 8px;
      border: 1px dashed;
    }
    .scroller {
      width: 420px;
      height: 130px;
      overflow-y: auto;
      border: 1px solid;
    }
    .scroll-content {
      height: 1100px;
    }
    #nested-outer {
      padding: 20px;
      border: 2px solid;
    }
    #nested-inner {
      padding: 20px;
      border: 2px dashed;
    }
  </style>
</head>
<body>
  <section id="explicit-root">
    <div id="explicit-neutral" class="focusable" tabindex="0">explicit neutral</div>
    <button id="explicit-button" type="button">native button</button>
    <input id="explicit-input" type="text" value="">
  </section>

  <button id="outside-button" type="button">outside root</button>
  <div id="outside-neutral" class="focusable" tabindex="0">outside neutral</div>

  <section id="normal-passive-section">
    <div id="normal-scroller" class="scroller" tabindex="0">
      <div class="scroll-content">normal listener scroller</div>
    </div>
  </section>

  <section id="passive-section">
    <div id="passive-scroller" class="scroller" tabindex="0">
      <div class="scroll-content">passive listener scroller</div>
    </div>
  </section>

  <section id="nested-outer">
    <div id="nested-inner" tabindex="0">nested focus target</div>
  </section>

  <div id="detachment-host"></div>

  <pre id="research-output"></pre>
  <script type="module" src="/fixture/main.mjs"></script>
</body>
</html>
