<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>WIF DOM wheel listener research</title>
</head>
<body>
<script>
(() => {
  const results = {};

  function wheel() {
    return new WheelEvent("wheel", {
      bubbles: true,
      cancelable: true,
      deltaY: 1,
    });
  }

  {
    const handler = (event) => event.preventDefault();
    document.addEventListener("wheel", handler);
    const event = wheel();
    const dispatchResult = document.dispatchEvent(event);
    results.documentOmittedPassive = {
      defaultPrevented: event.defaultPrevented,
      dispatchResult,
    };
    document.removeEventListener("wheel", handler);
  }

  {
    const handler = (event) => event.preventDefault();
    document.addEventListener("wheel", handler, { passive: false });
    const event = wheel();
    const dispatchResult = document.dispatchEvent(event);
    results.documentExplicitNonPassive = {
      defaultPrevented: event.defaultPrevented,
      dispatchResult,
    };
    document.removeEventListener("wheel", handler);
  }

  {
    const target = document.createElement("div");
    document.body.append(target);
    const handler = (event) => event.preventDefault();
    target.addEventListener("wheel", handler);
    const event = wheel();
    const dispatchResult = target.dispatchEvent(event);
    results.elementOmittedPassive = {
      defaultPrevented: event.defaultPrevented,
      dispatchResult,
    };
    target.removeEventListener("wheel", handler);
    target.remove();
  }

  {
    const target = document.createElement("div");
    document.body.append(target);
    const handler = (event) => event.preventDefault();
    target.addEventListener("wheel", handler, { passive: true });
    const event = wheel();
    const dispatchResult = target.dispatchEvent(event);
    results.elementExplicitPassive = {
      defaultPrevented: event.defaultPrevented,
      dispatchResult,
    };
    target.removeEventListener("wheel", handler);
    target.remove();
  }

  {
    const parent = document.createElement("div");
    const child = document.createElement("div");
    parent.append(child);
    document.body.append(parent);
    const order = [];
    const parentSeen = [];
    const childHandler = (event) => {
      order.push("child");
      event.preventDefault();
    };
    const parentHandler = (event) => {
      order.push("parent");
      parentSeen.push(event.defaultPrevented);
    };
    child.addEventListener("wheel", childHandler, { passive: false });
    parent.addEventListener("wheel", parentHandler, { passive: false });
    const event = wheel();
    child.dispatchEvent(event);
    results.preventDefaultDoesNotStopPropagation = {
      order,
      parentSawDefaultPrevented: parentSeen[0] ?? null,
      finalDefaultPrevented: event.defaultPrevented,
    };
    child.removeEventListener("wheel", childHandler);
    parent.removeEventListener("wheel", parentHandler);
    parent.remove();
  }

  {
    const parent = document.createElement("div");
    const child = document.createElement("div");
    parent.append(child);
    document.body.append(parent);
    const order = [];
    child.addEventListener("wheel", () => order.push("child"));
    parent.addEventListener("wheel", () => order.push("parent"));
    child.dispatchEvent(wheel());
    results.nestedListenersReceiveSameBubblingEvent = {
      order,
      count: order.length,
    };
    parent.remove();
  }

  {
    const target = document.createElement("div");
    let count = 0;
    target.addEventListener("wheel", () => {
      count += 1;
    });
    document.body.append(target);
    target.remove();
    target.dispatchEvent(wheel());
    results.detachedTargetRetainsListenerUntilCleanup = { count };
  }

  {
    const target = document.createElement("div");
    let count = 0;
    const handler = () => {
      count += 1;
    };
    target.addEventListener("wheel", handler);
    target.removeEventListener("wheel", handler);
    target.removeEventListener("wheel", handler);
    target.dispatchEvent(wheel());
    results.repeatedExplicitRemovalIsSafe = { count };
  }

  {
    const target = document.createElement("div");
    let count = 0;
    const controller = new AbortController();
    target.addEventListener("wheel", () => {
      count += 1;
    }, { signal: controller.signal });
    controller.abort();
    controller.abort();
    target.dispatchEvent(wheel());
    results.abortSignalCleanupIsSafe = { count };
  }

  {
    const unrelated = document.createElement("div");
    document.body.append(unrelated);
    let count = 0;
    const handler = () => {
      count += 1;
    };
    window.addEventListener("wheel", handler);
    unrelated.dispatchEvent(wheel());
    results.windowObservesDescendantWheel = { count };
    window.removeEventListener("wheel", handler);
    unrelated.remove();
  }

  {
    const parent = document.createElement("div");
    const first = document.createElement("div");
    const second = document.createElement("div");
    parent.append(first, second);
    document.body.append(parent);
    const counts = { first: 0, second: 0 };
    first.addEventListener("wheel", () => {
      counts.first += 1;
    });
    second.addEventListener("wheel", () => {
      counts.second += 1;
    });
    first.dispatchEvent(wheel());
    results.disjointSiblingTargetsStayScoped = counts;
    parent.remove();
  }

  {
    const parent = document.createElement("div");
    const child = document.createElement("div");
    parent.append(child);
    document.body.append(parent);
    const order = [];
    child.addEventListener("wheel", (event) => {
      order.push("child-first");
      event.stopPropagation();
    });
    child.addEventListener("wheel", () => {
      order.push("child-second");
    });
    parent.addEventListener("wheel", () => {
      order.push("parent");
    });
    child.dispatchEvent(wheel());
    results.stopPropagationDoesNotStopSameTargetListeners = { order };
    parent.remove();
  }

  {
    const parent = document.createElement("div");
    const child = document.createElement("div");
    parent.append(child);
    document.body.append(parent);
    const order = [];
    child.addEventListener("wheel", (event) => {
      order.push("child-first");
      event.stopImmediatePropagation();
    });
    child.addEventListener("wheel", () => {
      order.push("child-second");
    });
    parent.addEventListener("wheel", () => {
      order.push("parent");
    });
    child.dispatchEvent(wheel());
    results.stopImmediatePropagationSuppressesLaterListeners = { order };
    parent.remove();
  }

  {
    const parent = document.createElement("div");
    const child = document.createElement("div");
    parent.append(child);
    document.body.append(parent);
    let parentRequests = 0;
    child.addEventListener("wheel", (event) => {
      event.preventDefault();
    }, { passive: false });
    parent.addEventListener("wheel", (event) => {
      if (!event.defaultPrevented) parentRequests += 1;
    }, { passive: false });
    child.dispatchEvent(wheel());
    results.defaultPreventedGateWorksOnlyWhenCancellationSucceeds = {
      parentRequests,
    };
    parent.remove();
  }

  {
    const parent = document.createElement("div");
    const child = document.createElement("div");
    parent.append(child);
    document.body.append(parent);
    let parentRequests = 0;
    child.addEventListener("wheel", (event) => {
      event.preventDefault();
    }, { passive: false });
    parent.addEventListener("wheel", (event) => {
      if (!event.defaultPrevented) parentRequests += 1;
    }, { passive: false });
    const event = new WheelEvent("wheel", {
      bubbles: true,
      cancelable: false,
      deltaY: 1,
    });
    child.dispatchEvent(event);
    results.defaultPreventedGateFailsForNonCancelableEvent = {
      parentRequests,
      defaultPrevented: event.defaultPrevented,
    };
    parent.remove();
  }

  {
    const parent = document.createElement("div");
    const child = document.createElement("div");
    parent.append(child);
    document.body.append(parent);
    let parentRequests = 0;
    child.addEventListener("wheel", () => {
      // Prevention intentionally disabled.
    }, { passive: false });
    parent.addEventListener("wheel", (event) => {
      if (!event.defaultPrevented) parentRequests += 1;
    }, { passive: false });
    child.dispatchEvent(wheel());
    results.defaultPreventedGateFailsWhenPreventionDisabled = {
      parentRequests,
    };
    parent.remove();
  }

  {
    const parent = document.createElement("div");
    const child = document.createElement("div");
    parent.append(child);
    document.body.append(parent);
    const order = [];
    parent.addEventListener("wheel", () => {
      order.push("parent-capture");
    }, { capture: true });
    child.addEventListener("wheel", () => {
      order.push("child-bubble");
    });
    child.dispatchEvent(wheel());
    results.captureChangesOrderButNotMultiplicity = { order };
    parent.remove();
  }

  document.documentElement.setAttribute(
    "data-wif-wheel-research",
    encodeURIComponent(JSON.stringify(results)),
  );
})();
</script>
</body>
</html>
